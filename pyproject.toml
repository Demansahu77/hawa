[project]
name = "hawa"
version = "0.1.0"
description = "Three years of hourly PM2.5 across ten Indian cities, analysed with pandas."
readme = "README.md"
authors = [
    { name = "Deman Sahu", email = "demansahu424@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pytest>=9.1.1",
]
